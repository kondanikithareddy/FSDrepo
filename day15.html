<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Assignment</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    tr:hover {
      background-color: #e0e0e0;
    }
    td {
      text-align: right; /* Right-align numeric values */
    }

    /* Mouse Trail */
    .trail {
      position: absolute;
      height: 6px;
      width: 6px;
      border-radius: 3px;
      background: teal;
      pointer-events: none;
    }

    body {
      height: 300px;
    }

    /* Tabs */
    tab-panel {
      display: block;
    }
    tab-panel div {
      display: none;
    }
    tab-panel button {
      margin: 5px;
      padding: 10px;
      cursor: pointer;
    }
    /* Show the active tab */
    .active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Task 1: Table will be inserted here -->
  <h1>Mountains</h1>
  <div id="mountains"></div>

  <!-- Task 2: Elements by tag name -->
  <h1>Heading with a <span>span</span> element.</h1>
  <p>A paragraph with <span>one</span>, <span>two</span> spans.</p>

  <!-- Task 4: Tabs -->
  <tab-panel>
    <button data-tabname="one">Tab One</button>
    <button data-tabname="two">Tab Two</button>
    <button data-tabname="three">Tab Three</button>
    <div data-tabname="one" class="active">Tab one content</div>
    <div data-tabname="two">Tab two content</div>
    <div data-tabname="three">Tab three content</div>
  </tab-panel>

  <script>
    // 1: Build a Table
    const MOUNTAINS = [
      { name: "Kilimanjaro", height: 5895, place: "Tanzania" },
      { name: "Everest", height: 8848, place: "Nepal" },
      { name: "Mount Fuji", height: 3776, place: "Japan" },
      { name: "Vaalserberg", height: 323, place: "Netherlands" },
      { name: "Denali", height: 6168, place: "United States" },
      { name: "Popocatepetl", height: 5465, place: "Mexico" },
      { name: "Mont Blanc", height: 4808, place: "Italy/France" }
    ];

    function buildTable(data) {
      const table = document.createElement("table");
      const headerRow = document.createElement("tr");

      // Create table header from keys of the first object
      Object.keys(data[0]).forEach(key => {
        const header = document.createElement("th");
        header.textContent = key;
        headerRow.appendChild(header);
      });
      table.appendChild(headerRow);

      // Create rows for each object in data
      data.forEach(mountain => {
        const row = document.createElement("tr");
        Object.values(mountain).forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          if (typeof value === "number") {
            cell.style.textAlign = "right";
          }
          row.appendChild(cell);
        });
        table.appendChild(row);
      });

      return table;
    }
    document.getElementById("mountains").appendChild(buildTable(MOUNTAINS));

    // 2: Elements by Tag Name
    function byTagName(node, tagName) {
      let elements = [];
      tagName = tagName.toUpperCase(); //because node name is always in upper case
      function findElements(currentNode) { //recursive function
        if (currentNode.nodeName === tagName) {
          elements.push(currentNode);
        }
        for (let child of currentNode.childNodes) {
          if (child.nodeType === document.ELEMENT_NODE) {
            findElements(child);
          }
        }
      }
      findElements(node);
      return elements;
    }
    console.log(byTagName(document.body, "h1").length); // → 1
    console.log(byTagName(document.body, "span").length); // → 3
    let para = document.querySelector("p");
    console.log(byTagName(para, "span").length); // → 2

    // 3: Mouse Trail
    //10 div elements are created and stored in an array, each representing a dot in the mouse trail.
    const trailElements = [];
    const trailLength = 10; //10 dots
    for (let i = 0; i < trailLength; i++) {
      let trail = document.createElement("div");
      trail.className = "trail";
      document.body.appendChild(trail); //making it visible on page
      trailElements.push(trail);
    }
    let currentIndex = 0;
    document.addEventListener("mousemove", event => {
      let trail = trailElements[currentIndex];
      trail.style.left = event.pageX + "px"; //mouse cuurent position
      trail.style.top = event.pageY + "px";
      currentIndex = (currentIndex + 1) % trailLength; //circular effect when it reaches 10
    });

    // 4: Tabs
    function asTabs(node) {
      const buttons = node.querySelectorAll('button');
      const panels = node.querySelectorAll('div');

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          // Hide all panels
          panels.forEach(panel => panel.classList.remove('active'));
          buttons.forEach(btn => btn.style.fontWeight = 'normal');
          
          // Show the selected panel
          const tabName = button.getAttribute('data-tabname');
          const activePanel = node.querySelector(`div[data-tabname="${tabName}"]`);
          activePanel.classList.add('active');
          button.style.fontWeight = 'bold';
        });
      });
    }

    asTabs(document.querySelector('tab-panel'));
  </script>

</body>
</html>
